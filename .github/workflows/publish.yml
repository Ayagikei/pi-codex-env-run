name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0). Bumps package.json before publishing."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11 (trusted publishing requires npm >= 11.5.1;
          # Node 22's bundled npm 10 fails OIDC exchange with E404).
          # No registry-url / NODE_AUTH_TOKEN: npm auto-detects the OIDC token
          # from GitHub Actions and publishes via Trusted Publishing.
          node-version: "24"

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        run: |
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version

      - name: Run tests
        run: node --test tests/parser.test.mjs

      - name: Publish to npm
        run: npm publish --provenance --access public
