name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0). Bumps package.json before publishing."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11 (trusted publishing requires npm >= 11.5.1;
          # Node 22's bundled npm 10 fails OIDC exchange with E404).
          # No registry-url / NODE_AUTH_TOKEN: npm auto-detects the OIDC token
          # from GitHub Actions and publishes via Trusted Publishing.
          node-version: "24"

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ steps.version.outputs.value }}"
          if [ "$CURRENT" != "$TARGET" ]; then
            npm version "$TARGET" --no-git-tag-version
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already at $TARGET, skipping bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Debug OIDC env
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL != '' }}"
          echo "npm version: $(npm --version)"

      - name: Publish to npm
        run: npm publish --provenance --access public --loglevel verbose
        env:
          npm_config_loglevel: verbose

      # Keep the repo's package.json in sync with what was actually published:
      # the bump above never commits, so without this the repo falls behind npm
      # (e.g. npm had 0.3.0 while package.json stayed at 0.2.0). Only pushes back
      # when this run performed the bump; a local pre-bump (CURRENT == TARGET)
      # leaves nothing to commit. [skip ci] guards against future push-triggered
      # workflows. contents: write is required for this push.
      - name: Commit version bump back to main
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.value }} [skip ci]"
          git push origin HEAD:main
